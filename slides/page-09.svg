<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Noto Serif SC, serif">
  <rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/>

  <text x="64" y="84" font-size="30" fill="#1F1F1F" font-weight="600">手法四 · 元小说的自觉</text>
  <text x="64" y="116" font-size="15" fill="#A6392E">把「文学」写进志怪：人活一世，到底什么才能留下？</text>
  <line x1="64" y1="138" x2="896" y2="138" stroke="#E3E0DA" stroke-width="1"/>

  <!-- two requests -->
  <rect x="64" y="166" width="380" height="108" fill="#FAF9F6"/>
  <text x="88" y="198" font-size="15" fill="#A6392E" font-weight="600">其一 · 诗稿传世</text>
  <text x="88" y="226" font-size="13" fill="#555555">老虎拜托袁傪：替我把诗稿整理出来，</text>
  <text x="88" y="247" font-size="13" fill="#555555">让这些诗能够传世。</text>

  <rect x="516" y="166" width="380" height="108" fill="#FAF9F6"/>
  <text x="540" y="198" font-size="15" fill="#A6392E" font-weight="600">其二 · 隐瞒化虎</text>
  <text x="540" y="226" font-size="13" fill="#555555">还有——别让老朋友们知道，</text>
  <text x="540" y="247" font-size="13" fill="#555555">我已经变成了老虎。</text>

  <!-- shame quote -->
  <text x="64" y="316" font-size="16" fill="#1F1F1F" font-family="KaiTi, Noto Serif SC">「唉，连我自己都觉得自己好虚荣啊。」</text>
  <text x="64" y="344" font-size="13" fill="#555555">一边是对作品传世的渴望，一边是对自己狼狈形貌的羞耻——既高兴，又为高兴而羞愧。</text>

  <!-- conclusion -->
  <rect x="64" y="368" width="832" height="64" fill="#FFFFFF" stroke="#A6392E" stroke-width="1"/>
  <text x="480" y="396" font-size="15" fill="#1F1F1F" text-anchor="middle" font-weight="600">一篇志怪小说，由此触碰到了文学本身的命题：</text>
  <text x="480" y="420" font-size="13" fill="#555555" text-anchor="middle">作品、作者、名声——什么才是真正能留下来的？</text>

  <!-- manuscript strip -->
  <image x="64" y="448" width="700" height="40" href="../materials/assets/calligraphy_strip.png" preserveAspectRatio="xMidYMid meet"/>
  <text x="784" y="474" font-size="11" fill="#B8B4AC">苏轼《寒食帖》 · 诗稿</text>

  <!-- footer -->
  <text x="64" y="528" font-size="11" fill="#B8B4AC">《山月记》读书分享 · 艺术手法</text>
  <text x="896" y="528" font-size="11" fill="#B8B4AC" text-anchor="end">09</text>
</svg>
