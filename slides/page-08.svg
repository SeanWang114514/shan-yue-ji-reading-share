<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Noto Serif SC, serif">
  <rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/>

  <text x="64" y="84" font-size="30" fill="#1F1F1F" font-weight="600">手法三 · 汉文格调与「山月」意象</text>
  <text x="64" y="116" font-size="15" fill="#A6392E">简淡的文字，为什么反而更有力量？</text>
  <line x1="64" y1="138" x2="896" y2="138" stroke="#E3E0DA" stroke-width="1"/>

  <!-- left points -->
  <text x="64" y="184" font-size="15" fill="#A6392E" font-weight="600">汉文体</text>
  <text x="170" y="184" font-size="13" fill="#555555">中岛敦汉学功底极深，小说语言简淡、克制，</text>
  <text x="170" y="205" font-size="13" fill="#555555">几乎不用华丽的修饰。</text>

  <text x="64" y="248" font-size="15" fill="#A6392E" font-weight="600">短句白描</text>
  <text x="170" y="248" font-size="13" fill="#555555">前半大段独白尤其明显，像古典笔记小说的腔调；</text>
  <text x="170" y="269" font-size="13" fill="#555555">情绪都压在平静叙述底下，爆发力反而更强。</text>

  <text x="64" y="312" font-size="15" fill="#A6392E" font-weight="600">意象点题</text>
  <text x="170" y="312" font-size="13" fill="#555555">「山月」这个意象本身——冷、空、远，</text>
  <text x="170" y="333" font-size="13" fill="#555555">恰好对应着李徵，也对应每一份不被理解的孤绝。</text>

  <!-- quote -->
  <line x1="64" y1="366" x2="470" y2="366" stroke="#EFEBE4" stroke-width="1"/>
  <text x="64" y="400" font-size="15" fill="#1F1F1F" font-family="KaiTi, Noto Serif SC">「深怕并非美玉，故不敢刻苦琢磨；</text>
  <text x="64" y="426" font-size="15" fill="#1F1F1F" font-family="KaiTi, Noto Serif SC">　又半信是美玉，故不肯与瓦砾为伍。」</text>
  <text x="64" y="456" font-size="12" fill="#8A8A8A">短句、白描、几乎零修饰——重话轻说，是这篇小说的口气。</text>

  <!-- right image -->
  <image x="520" y="164" width="376" height="289" href="../materials/assets/bamboo_moon.png" preserveAspectRatio="xMidYMid meet"/>
  <text x="520" y="476" font-size="11" fill="#B8B4AC">高其佩 · 竹月（冷、空、远）</text>

  <!-- footer -->
  <text x="64" y="528" font-size="11" fill="#B8B4AC">《山月记》读书分享 · 艺术手法</text>
  <text x="896" y="528" font-size="11" fill="#B8B4AC" text-anchor="end">08</text>
</svg>
